name: PROOFLINE checks
on:
  pull_request:
    paths: ["proofline/**", ".github/workflows/proofline-check.yml"]
  push:
    branches: [main]
    paths: ["proofline/**", ".github/workflows/proofline-check.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check proofline/dist/script.js
      - run: node proofline/check.cjs
