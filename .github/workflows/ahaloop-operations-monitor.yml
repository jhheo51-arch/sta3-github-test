name: AHALOOP availability monitor

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    name: AHALOOP signed-in journey availability
    runs-on: ubuntu-latest
    steps:
      - name: Check that the signed-in journey is protected and responding
        id: availability
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.AHALOOP_SITE_URL }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          code=$(curl --silent --show-error --max-time 30 --output /tmp/ahaloop-response --write-out "%{http_code}" "${SITE_URL%/}/api/session")
          test -s /tmp/ahaloop-response
          test "$code" = "401"
      - name: Open or update an availability issue
        if: ${{ steps.availability.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create ahaloop-operations --color D93F0B --description "아하루프 운영 안전망 경고" --force
          issue=$(gh issue list --state open --label ahaloop-operations --json number --jq '.[0].number // empty')
          body="아하루프의 로그인 보호 경로가 예상한 401 응답을 반환하지 않았습니다. 이 검사는 고객 데이터를 읽지 않습니다. 실행 기록: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "아하루프 로그인 보호 확인 필요" --label ahaloop-operations --body "$body"; fi
          exit 1
      - name: Close the availability issue after recovery
        if: ${{ steps.availability.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          issue=$(gh issue list --state open --label ahaloop-operations --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then gh issue close "$issue" --comment "아하루프의 로그인 보호 경로가 다시 정상 응답합니다."; fi
