name: AHALOOP harness

on:
  pull_request:
    paths:
      - "ahaloop/**"
      # main requires this real integration check for MEMOIVE PRs as well.
      - "memoive/**"
      - "proofline/**"
      - ".github/workflows/ahaloop-*.yml"
  push:
    branches: [main, "codex/**"]
    paths:
      - "ahaloop/**"
      - "proofline/**"
      - ".github/workflows/ahaloop-*.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ahaloop-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: AHALOOP harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ahaloop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ahaloop/package-lock.json
      - run: npm ci
      - run: npm run harness:pass

  prepare-recovery:
    name: Prepare automatic recovery
    needs: harness
    if: ${{ always() && needs.harness.result == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create a revert pull request
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha="${FAILED_SHA:0:7}"
          branch="automation/recover-${short_sha}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          parents=$(git show -s --format=%P "$FAILED_SHA" | wc -w)
          if [ "$parents" -gt 1 ]; then git revert -m 1 --no-edit "$FAILED_SHA"; else git revert --no-edit "$FAILED_SHA"; fi
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "자동 복구: ${short_sha} 되돌리기" --body "main 반영 뒤 AHALOOP 하네스가 실패해 마지막 변경을 되돌리는 복구 PR입니다. 이 PR도 같은 하네스를 통과해야 병합됩니다.")
          gh pr merge "$url" --auto --squash
