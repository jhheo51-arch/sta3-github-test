name: MEMOIVE checks

on:
  pull_request:
    paths:
      - "memoive/**"
      - ".github/workflows/memoive-check.yml"
  push:
    branches: [main]
    paths:
      - "memoive/**"
      - ".github/workflows/memoive-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memoive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
          node --check cloudflare-worker/src/index.js
      - name: Check the core journey data and self-study records
        run: node tests/submission-self-check.cjs
      - name: Reproduce technical before-and-after checks
        run: node tests/before-after-check.cjs
      - name: Check examples, use evidence, navigation and newest-first order
        run: |
          node tests/cases-use-check.cjs
          node tests/navigation-order-check.cjs
