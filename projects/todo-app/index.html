<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Todo</title>
  <link rel="stylesheet" href="style.css?v=search-status-filter" />
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">TODAY</p>
      <h1>My Todo</h1>
      <p class="subtitle">오늘 할 일을 가볍게 정리해보세요.</p>
    </header>

    <section class="calendar" aria-labelledby="calendar-title">
      <div class="calendar-header">
        <button id="previous-month" class="month-button" type="button">이전 달</button>
        <h2 id="calendar-title"></h2>
        <button id="next-month" class="month-button" type="button">다음 달</button>
      </div>
      <div class="calendar-weekdays" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span>
        <span>목</span><span>금</span><span>토</span>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
    </section>

    <form id="todo-form" class="todo-form">
      <label class="sr-only" for="todo-input">할 일</label>
      <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off" />
      <label class="priority-field" for="todo-priority">
        <span>우선순위</span>
        <select id="todo-priority">
          <option value="high">높음</option>
          <option value="medium" selected>보통</option>
          <option value="low">낮음</option>
        </select>
      </label>
      <label class="date-field" for="todo-date">
        <span>날짜</span>
        <input id="todo-date" type="date" />
      </label>
      <button type="submit">추가</button>
    </form>

    <section class="todo-section" aria-labelledby="selected-date-title">
      <h2 id="selected-date-title" class="selected-date-title"></h2>
      <label class="search-field" for="todo-search">
        <span>할 일 검색</span>
        <input
          id="todo-search"
          type="search"
          placeholder="Todo 제목을 검색하세요"
          autocomplete="off"
          aria-controls="todo-list"
        />
      </label>
      <div class="status-filter" role="group" aria-label="완료 상태 필터">
        <button class="status-filter-button" type="button" data-filter="all" aria-pressed="true">전체</button>
        <button class="status-filter-button" type="button" data-filter="active" aria-pressed="false">진행 중</button>
        <button class="status-filter-button" type="button" data-filter="completed" aria-pressed="false">완료</button>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
      <div id="empty-state" class="empty-state">아직 할 일이 없어요.</div>
      <section
        id="completion-celebration"
        class="completion-celebration"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        hidden
      >
        <p class="celebration-kicker">ALL DONE</p>
        <h2>모든 할 일을 완료했어요!</h2>
        <p class="celebration-message">오늘의 할 일을 모두 해낸 멋진 하루예요.</p>
      </section>
    </section>

    <footer>
      <span id="remaining-count">0개의 할 일 남음</span>
    </footer>
  </main>

  <script src="app.js?v=search-status-filter"></script>
</body>
</html>
